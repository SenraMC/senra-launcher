name: Construire le launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    # un système qui échoue n'arrête pas les autres ; jamais plus de 45 min par machine
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Mac Intel : les Mac arm64 de GitHub (macos-latest) sont saturés et laissaient la tâche sans machine
        # (beta.10) ; un Mac Intel fabrique aussi bien les deux .dmg (Intel et Apple Silicon)
        os: [macos-15-intel, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - run: npm ci
        shell: bash

      - run: |
          # version …-beta.N (staff) : publiée tout de suite en pré-version ; les autres restent en brouillon
          if node -p "require('./package.json').version" | grep -q -- '-beta'; then export EP_PRE_RELEASE=true; fi
          npm run dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
