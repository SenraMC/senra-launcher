appId: 'fr.senramc.launcher'
productName: 'Senra Launcher'
artifactName: 'Senra-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Senra · basé sur HeliosLauncher (Daniel Scalzi, licence MIT)'

asar: true
compression: 'maximum'

files:
  - '!{dist,distribution,.gitignore,.gitattributes,README.md}'

extraResources:
  - 'libraries'

publish:
  provider: 'github'
  owner: 'SenraMC'
  repo: 'senra-launcher'

win:
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: 'Senra Launcher'

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Senra-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

linux:
  # AppImage (toutes les distributions) + .deb (Debian, Ubuntu, Mint, Kali…) : le .deb s'installe avec son raccourci
  # dans le menu et se met à jour tout seul (le système demande le mot de passe)
  target:
    - 'AppImage'
    - 'deb'
  executableName: 'senra-launcher'
  icon: 'build/icon.png'
  maintainer: 'Senra'
  vendor: 'Senra'
  synopsis: 'Launcher du serveur Senra Naruto RP'
  description: 'Installe Minecraft 1.21.11, Fabric et les mods de Senra, puis connecte au serveur Senra Naruto RP.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'